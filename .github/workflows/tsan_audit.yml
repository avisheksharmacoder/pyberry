name: PyBerry Crucible (TSan Audit)

on:
  pull_request:
    branches: [ main ]
    # We must listen for label events to trigger the escape hatch
    types: [opened, synchronize, reopened, labeled, unlabeled] 

jobs:
  tsan_audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check for Escape Hatch Label
        id: check_label
        run: |
          if contains(github.event.pull_request.labels.*.name, 'bypass-tsan'); then
            echo "Bypass label detected. Skipping strict TSan audit."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v4
        if: steps.check_label.outputs.skip != 'true'
      
      - name: Set up Python 3.12
        if: steps.check_label.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          
      - name: Install Compilers & Dependencies
        if: steps.check_label.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang gcc
          python -m pip install --upgrade pip setuptools wheel Cython pytest
          pip install -r requirements.txt
          
      - name: Run The Crucible
        if: steps.check_label.outputs.skip != 'true'
        env:
          PYBERRY_TSAN: "1"
          TSAN_OPTIONS: "suppressions=tsan_suppressions.txt halt_on_error=1 history_size=7"
        run: |
          # Build the core framework extensions with TSan enabled
          python3 setup.py build_ext --inplace
          # Run the test suite; it will crash immediately if a data race occurs
          python3 -m pytest tests/
